<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #f7f7f5; color: #141414; font-family: "Source Sans 3", sans-serif; }
  .tools { min-height: 56px; background: #141414; color: #f7f7f5; display: flex; align-items: center; gap: 18px; padding: 14px 16px; font-size: 14px; }
  .tools b { font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.16em; font-size: 18px; }
  .tools .sp { margin-left: auto; }
  .band { min-height: 112px; background: #d21f1f; color: #fff; display: flex; align-items: center; padding: 16px 28px; gap: 28px; }
  .band .job { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.04em; line-height: 1; }
  .band .meta { font-size: 18px; }
  .band .alts { margin-left: auto; display: flex; gap: 8px; }
  .band button { background: transparent; color: #fff; border: 1px solid #fff; height: 36px; padding: 0 14px; font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.12em; font-size: 16px; }
  .work { display: flex; height: 764px; }
  .plan { flex: 1; margin: 16px; background:
      repeating-linear-gradient(#e4e4e0 0 1px, transparent 1px 56px),
      repeating-linear-gradient(90deg, #e4e4e0 0 1px, transparent 1px 56px),
      #fff; border: 1px solid #141414; position: relative; }
  .room { position: absolute; inset: 12% 16% 18% 10%; border: 2px solid #141414; }
  .here { position: absolute; left: 42%; top: 46%; width: 22px; height: 22px; border-radius: 50%; background: #d21f1f; box-shadow: 0 0 0 6px rgba(210,31,31,0.25); }
  .here span { position: absolute; left: 32px; top: -4px; font-family: "Barlow Condensed", sans-serif; font-size: 22px; letter-spacing: 0.04em; white-space: nowrap; background: #fff; color: #141414; padding: 4px 8px; }
  .zone { position: absolute; left: 18%; top: 22%; width: 28%; height: 24%; border: 1px dashed #141414; }
  .vid { position: absolute; right: 16px; bottom: 16px; width: 280px; height: 168px; background: #1c1e1c; border: 1px solid #141414; }
  .person { position: absolute; left: 40%; top: 18%; width: 36px; height: 80px; border: 2px solid #f7f7f5; }
  .dir { width: 300px; border-left: 1px solid #141414; display: flex; flex-direction: column; }
  .dir h2 { font-family: "Barlow Condensed", sans-serif; font-size: 28px; font-weight: 600; padding: 16px 16px 8px; letter-spacing: 0.06em; }
  .row { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #141414; font-size: 14px; }
  .warn { margin: 16px; border: 1px solid #d21f1f; color: #d21f1f; text-align: center; font-family: "Barlow Condensed", sans-serif; letter-spacing: 0.04em; padding: 12px; font-size: 18px; }
  button.go { margin: 0 16px; height: 40px; background: #141414; color: #fff; border: 0; font-weight: 600; }
</style>
</head>
<body>
  <div class="tools"><b>ECHO</b><span>connected</span><span class="sp">vtest.avi · simulated</span></div>
  <div class="band">
    <div class="job">LIVE</div>
    <div class="meta">Kitchen template<br />t 0:12.4 · person p-014 in Counter</div>
    <div class="alts"><button>MAP</button><button>REPLAY</button></div>
  </div>
  <div class="work">
    <div class="plan">
      <div class="room"></div>
      <div class="zone"></div>
      <div class="here"><span>YOU ARE HERE · p-014</span></div>
      <div class="vid"><div class="person"></div></div>
    </div>
    <aside class="dir">
      <h2>SESSION</h2>
      <div class="row"><span>Source</span><span>Video file</span></div>
      <div class="row"><span>Detector</span><span>YOLO + ByteTrack</span></div>
      <div class="row"><span>Calibration</span><span>none</span></div>
      <div class="row"><span>ArUco</span><span>on</span></div>
      <div class="row"><span>Rate</span><span>10 fps</span></div>
      <div class="warn">UNCALIBRATED</div>
      <button class="go">Stop session</button>
    </aside>
  </div>
</body>
</html>
